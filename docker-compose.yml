services:
  portfolio:
    build: .
    container_name: mi-portfolio-nextjs
    restart: always
    ports:
      # De vuelta a la identidad de producción: Fernando pidió volver a
      # dejar este portfolio (el anterior al rediseño espacial) en el
      # puerto 80 mientras el rediseño (redesign/space-v2, ahora en
      # master) sigue afinándose en el puerto de Tailscale — ver stack
      # "portfolio-legacy" en Portainer, que pasa a servir esa rama.
      - "80:3000"
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REMOVE_BG_API_KEY=${REMOVE_BG_API_KEY:-}
      - NBA_API_KEY=${NBA_API_KEY:-}
      # PAT fine-grained con cero permisos de repositorio (o clásico con solo
      # read:user). Sirve /experience#actividad-de-codigo; sin él, cae al
      # snapshot de content/github-fallback.json.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Formulario de contacto: aviso al móvil por el centro de avisos del
      # servidor (emisor "portfolio"). La clave vive en .env, fuera de git.
      - AVISOS_URL=${AVISOS_URL:-}
      - AVISOS_CLAVE=${AVISOS_CLAVE:-}
    volumes:
      # Lo escribe scripts/homelab-stats.sh vía cron de usuario en el host,
      # fuera de este contenedor. Sirve /api/homelab-stats; sin él (o si
      # supera 48h), cae al snapshot de content/homelab-stats-fallback.json.
      - /home/fernando/servicios/homelab-stats/homelab-stats.json:/app/data/homelab-stats.json:ro
      # Copia en disco de cada mensaje del formulario (lib/contact-delivery.ts).
      - /home/fernando/servicios/portfolio/mensajes:/app/data/mensajes
    networks:
      - default
      # Solo para llegar a avisos-api por nombre.
      - avisos

networks:
  avisos:
    external: true
    name: ntfy-privado_default
