version: '3.9'
services:
  portfolio:
    build: .
    container_name: mi-portfolio-dev
    restart: always
    ports:
      # Solo Tailscale mientras el rediseño espacial sigue afinándose: el
      # puerto 80 lo recuperó el portfolio anterior (rama
      # legacy/pre-space-redesign) a petición de Fernando. Mismo patrón que
      # mi-react-dash (3010) — bind explícito a la IP de Tailscale, no
      # 0.0.0.0. Volver a "80:3000" cuando el rediseño esté listo para
      # sustituir de nuevo a producción.
      - "100.93.209.52:3070:3000"
    environment:
      - NODE_ENV=production
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - REMOVE_BG_API_KEY=${REMOVE_BG_API_KEY:-}
      - NBA_API_KEY=${NBA_API_KEY:-}
      # PAT fine-grained con cero permisos de repositorio (o clásico con solo
      # read:user). Sirve /experience#actividad-de-codigo; sin él, cae al
      # snapshot de content/github-fallback.json.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
    volumes:
      # Lo escribe scripts/homelab-stats.sh vía cron de usuario en el host,
      # fuera de este contenedor. Sirve /api/homelab-stats; sin él (o si
      # supera 48h), cae al snapshot de content/homelab-stats-fallback.json.
      - /home/fernando/homelab-stats/homelab-stats.json:/app/data/homelab-stats.json:ro
