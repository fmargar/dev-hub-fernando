name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npx tsc --noEmit

      - run: npm test

      # La build no debe depender de ningún servicio externo ni secreto
      # (PRODUCT.md): correr sin variables de entorno es el test de esa
      # restricción, no un descuido.
      - run: npm run build
